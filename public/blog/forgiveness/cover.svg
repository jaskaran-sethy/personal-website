<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18181C"/>
      <stop offset="1" stop-color="#0E0E10"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#D4AF37" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F1D98B"/>
      <stop offset="0.45" stop-color="#D4AF37"/>
      <stop offset="1" stop-color="#A8842A"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Mount -->
  <line x1="470" y1="70" x2="730" y2="70" stroke="#3A3A43" stroke-width="2"/>
  <g stroke="#2A2A31" stroke-width="2">
    <path d="M490 70l-14-14M520 70l-14-14M550 70l-14-14M580 70l-14-14M610 70l-14-14M640 70l-14-14M670 70l-14-14M700 70l-14-14M730 70l-14-14"/>
  </g>

  <!-- The swing: radius 420 about (600, 70), out to ±40° -->
  <path d="M330 392A420 420 0 0 0 870 392" stroke="#3A3A43" stroke-width="1.5" stroke-dasharray="2 9" fill="none"/>

  <!-- The extremes -->
  <g stroke="#3A3A43" stroke-width="1.5">
    <line x1="600" y1="70" x2="330" y2="392"/>
    <line x1="600" y1="70" x2="870" y2="392"/>
  </g>
  <g fill="#2A2A31" stroke="#4A4A54" stroke-width="2">
    <circle cx="330" cy="392" r="30"/>
    <circle cx="870" cy="392" r="30"/>
  </g>
  <!-- Motion on the way back to centre -->
  <g fill="#D4AF37">
    <circle cx="456" cy="465" r="22" fill-opacity="0.12"/>
    <circle cx="744" cy="465" r="22" fill-opacity="0.12"/>
    <circle cx="527" cy="484" r="26" fill-opacity="0.22"/>
    <circle cx="673" cy="484" r="26" fill-opacity="0.22"/>
  </g>

  <!-- At rest in the middle -->
  <circle cx="600" cy="490" r="120" fill="url(#glow)"/>
  <line x1="600" y1="70" x2="600" y2="460" stroke="#D4AF37" stroke-width="3"/>
  <circle cx="600" cy="70" r="7" fill="#D4AF37"/>
  <circle cx="600" cy="490" r="32" fill="url(#gold)"/>

  <line x1="540" y1="560" x2="660" y2="560" stroke="#D4AF37" stroke-opacity="0.5" stroke-width="2"/>
</svg>
